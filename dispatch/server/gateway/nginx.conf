user root;
worker_processes 1;
pid /data/AIGO/platform_start/config_dispatch/gateway/run/nginx.pid;
error_log stderr warn;
events { worker_connections 128; }
http {
 server_tokens off;
 access_log off;
 client_max_body_size 64k;
 client_body_timeout 12s;
 client_header_timeout 12s;
 keepalive_timeout 20s;
 send_timeout 20s;
 client_body_temp_path /data/AIGO/platform_start/config_dispatch/gateway/temp/client;
 proxy_temp_path /data/AIGO/platform_start/config_dispatch/gateway/temp/proxy;
 fastcgi_temp_path /data/AIGO/platform_start/config_dispatch/gateway/temp/fastcgi;
 uwsgi_temp_path /data/AIGO/platform_start/config_dispatch/gateway/temp/uwsgi;
 scgi_temp_path /data/AIGO/platform_start/config_dispatch/gateway/temp/scgi;
 limit_req_zone $binary_remote_addr zone=dispatch_auth:1m rate=12r/m;
 limit_conn_zone $binary_remote_addr zone=dispatch_connections:1m;
 server {
  listen 172.16.129.236:8899 ssl;
  server_name 172.16.129.236;
  ssl_certificate /data/AIGO/platform_start/config_dispatch/tls/server/server.crt;
  ssl_certificate_key /data/AIGO/platform_start/config_dispatch/tls/server/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5:!3DES:!DES:!RC4:!SHA1;
  ssl_session_cache shared:dispatch_tls:2m;
  ssl_session_timeout 10m;
  ssl_session_tickets off;
  error_page 497 =308 https://172.16.129.236:8899$request_uri;
  limit_conn dispatch_connections 20;
  location = /healthz { return 404; }
  location ~ ^/api/auth/(login|bootstrap)$ {
   limit_req zone=dispatch_auth burst=8 nodelay;
   limit_req_status 429;
   include /data/AIGO/platform_start/config_dispatch/gateway/proxy.conf;
  }
  location / { include /data/AIGO/platform_start/config_dispatch/gateway/proxy.conf; }
 }
}
