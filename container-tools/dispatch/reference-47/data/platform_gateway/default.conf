# Included by the existing frontend container's nginx.conf inside http {}.
# nginx 1.31 in this container has ssl + auth_request modules.
map_hash_bucket_size 128;
map $http_upgrade $platform_connection_upgrade { default upgrade; '' close; }
map $uri $platform_cache_control {
    default "";
    /index.html no-store;
    /static/js/config.js no-store;
    /static/certificates/dispatch-root-ca.cer no-store;
    /static/certificates/install-dispatch-certificate.ps1 no-store;
    /static/certificates/dispatch-certificate-windows.zip no-store;
    /static/certificates/README.txt no-store;
}
map $uri $platform_certificate_download {
    default "";
    /static/certificates/dispatch-root-ca.cer 'attachment; filename="dispatch-root-ca.cer"';
    /static/certificates/install-dispatch-certificate.ps1 'attachment; filename="install-dispatch-certificate.ps1"';
    /static/certificates/dispatch-certificate-windows.zip 'attachment; filename="dispatch-certificate-windows.zip"';
    /static/certificates/README.txt 'attachment; filename="README.txt"';
}
log_format platform_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';

server {
    listen 8888 ssl;
    server_name 192.168.110.47;
    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    server_tokens off;
    access_log /var/log/nginx/platform-access.log platform_safe;
    error_log /var/log/nginx/platform-error.log warn;
    ssl_certificate /etc/platform_gateway/tls/server-chain.crt;
    ssl_certificate_key /etc/platform_gateway/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PlatformTLS:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;
    error_page 497 =301 https://192.168.110.47:8888$request_uri;
    client_max_body_size 512m;
    client_body_timeout 60s;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control $platform_cache_control always;
    add_header Content-Disposition $platform_certificate_download always;

    location = /api { return 308 /api/; }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_read_timeout 180s;
        proxy_redirect off;
    }

    # Media-only cookie validation; never substitute this cookie for API Bearer.
    location = /_platform_media_auth {
        internal;
        proxy_pass http://127.0.0.1:5000/security/media-access;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Authorization "";
    }

    location = /media/index/api/webrtc {
        if ($args ~* "(^|&)(secret|api_secret|zlk_secret)=") { return 400; }
        auth_request /_platform_media_auth;
        limit_except POST OPTIONS { deny all; }
        proxy_pass http://127.0.0.1:8085/index/api/webrtc;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_read_timeout 30s;
    }
    location ~* ^/media/(?:index/|__defaultVhost__/index/) { return 404; }
    location = /media { return 404; }
    location = /media/ { return 404; }
    location = /media/alarms { return 404; }
    location = /media/alarms/ { return 404; }
    location ^~ /media/alarms/ {
        # Reject residual escapes after nginx URI normalization. This prevents
        # a second upstream decode from turning a filename into ../ or /.
        if ($uri ~* "%[0-9a-f]{2}") { return 400; }
        if ($uri !~* "\.(mp4|flv|jpe?g|png|webp|gif)$") { return 404; }
        auth_request /_platform_media_auth;
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:9002/data/AIGO/python/bingxing_model/results/;
        proxy_http_version 1.1;
        proxy_set_header Host 192.168.110.47;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_redirect off;
    }
    location ^~ /media/alarm-storage/ {
        if ($uri ~* "%[0-9a-f]{2}") { return 400; }
        if ($uri !~* "^/media/alarm-storage/[a-f0-9]{20}/.+\.(mp4|avi|mov|mkv|jpe?g|png|webp|gif)$") { return 404; }
        auth_request /_platform_media_auth;
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:9002/alarm-storage/;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_redirect off;
    }
    location /media/ {
        if ($uri ~* "%[0-9a-f]{2}") { return 400; }
        if ($args ~* "(^|&)(secret|api_secret|zlk_secret)=") { return 400; }
        if ($uri !~* "\.(mp4|flv|ts|m3u8|m4s|aac|mpd|jpe?g|png|webp|gif)$") { return 404; }
        auth_request /_platform_media_auth;
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:8085/;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $platform_connection_upgrade;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_redirect off;
    }

    # Serve the existing business distribution directly. Do not publish maps,
    # configuration source, private keys, backup files or filesystem listings.
    location ~ (^|/)\. { return 404; }
    location ~* \.(?:map|bak|py|ini|log|pem|key|crt)$ { return 404; }
    # Public CA and local installer only; private key routes stay blocked.
    location = /static/certificates/dispatch-root-ca.cer {
        types { }
        default_type application/octet-stream;
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }
    location = /static/certificates/install-dispatch-certificate.ps1 {
        types { }
        default_type application/octet-stream;
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }
    location = /static/certificates/dispatch-certificate-windows.zip {
        types { }
        default_type application/octet-stream;
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }
    location = /static/certificates/README.txt {
        types { }
        default_type application/octet-stream;
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }
    location = /static/certificates { return 404; }
    location /static/certificates/ { return 404; }

    location = /index.html {
        try_files $uri =404;
    }
    location = /static/js/config.js {
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
}
