user root;
worker_processes auto;
pid /data/AIGO/platform_start/platform_gateway/nginx.pid;
error_log stderr warn;
events { worker_connections 1024; }
http {
access_log off;
include /data/AIGO/platform_start/runtime/nginx/conf/mime.types;
client_body_temp_path /data/AIGO/platform_start/platform_gateway/temp/client;
proxy_temp_path /data/AIGO/platform_start/platform_gateway/temp/proxy;
fastcgi_temp_path /data/AIGO/platform_start/platform_gateway/temp/fastcgi;
uwsgi_temp_path /data/AIGO/platform_start/platform_gateway/temp/uwsgi;
scgi_temp_path /data/AIGO/platform_start/platform_gateway/temp/scgi;
include /data/AIGO/platform_start/platform_gateway/default.conf;
server { listen 127.0.0.1:9002;
location /alarm-storage/ { alias /data/AIGO/platform_alarm_media/; }
location /data/AIGO/outputs/ { alias /data/AIGO/outputs/; }
}
}
